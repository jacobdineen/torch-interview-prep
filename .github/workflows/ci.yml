name: CI

# Guard the curriculum: every push/PR re-verifies that all problem reference
# solutions pass their tests and every project's reference passes, so a change to
# shared tooling, a reference, or a test can't silently break another problem/project.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# actions/cache@v4 still ships on Node 20 (deprecated mid-2026) and has no newer
# major yet; opt it into the Node 24 runtime so we don't ride the deprecation.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Cache HuggingFace models (distilgpt2)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-distilgpt2-v1

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy transformers einops jax

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Web static checks (contract, syntax, token wiring)
        run: python web/smoke_test.py --static

      - name: Verify all problems and projects
        run: python verify_all.py
