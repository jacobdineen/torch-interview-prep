<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mle_prep — practice</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">▚ mle_prep</div>
    <select id="source" title="Problems or a project"></select>
    <select id="framework" title="Filter by framework"></select>
    <div class="search-wrap">
      <input id="filter" type="text" placeholder="filter by id or title…  (↑↓ Enter, Esc)" autocomplete="off" spellcheck="false" />
      <div id="palette" class="palette hidden"></div>
    </div>
    <button id="prev-btn" title="Previous in list">‹</button>
    <button id="next-btn" title="Next unsolved">next ›</button>
    <div id="overall" class="overall"></div>
    <button id="teardown-btn" class="danger" title="Stop nvim, ttyd, and the server">⏻ Tear down</button>
  </header>

  <main id="split">
    <section id="left">
      <div class="prob-head">
        <h1 id="prob-title">—</h1>
        <div class="tags">
          <span id="prob-status" class="tag"></span>
          <span id="prob-framework" class="tag fw"></span>
          <span id="prob-source" class="tag"></span>
          <span id="prob-group" class="tag tier"></span>
        </div>
      </div>
      <pre id="prob-sig" class="sig"></pre>
      <div id="prob-doc" class="doc"></div>
      <details id="concept-wrap">
        <summary>Learn about this topic</summary>
        <div id="prob-concept" class="concept"></div>
      </details>
      <div class="left-actions">
        <button id="hint-btn">Hint</button>
        <button id="solution-btn">Solution</button>
      </div>
      <pre id="aux-out" class="aux"></pre>
    </section>

    <section id="right">
      <div class="editor-bar">
        <span class="editor-label">editor — your real nvim (<code>:w</code> then Run)</span>
        <span class="spacer"></span>
        <button id="run-btn" class="run">▶ Run</button>
        <button id="submit-btn" class="submit">⚡ Submit</button>
      </div>
      <iframe id="nvim" title="nvim"></iframe>
      <div id="results" class="results">
        <div class="results-head">Results</div>
        <div id="results-body" class="results-body muted">Edit in the editor, then Run.</div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
